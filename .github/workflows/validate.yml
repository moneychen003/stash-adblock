name: Validate public subscription
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python tools/validate.py
      - run: python tools/test_dual.py
      - run: python tools/test_compiler.py
      - run: python tools/test_coverage.py
      - run: node tools/test_scripts.cjs
      - run: node tools/test_qx_transform.cjs
      - run: node tools/test_fmz_video.cjs
      - run: node tools/test_media_ad_only.cjs
      - run: node tools/test_xiaohongshu.cjs
